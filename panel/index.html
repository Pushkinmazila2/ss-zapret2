<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evasion Landscape · zapret2</title>
<style>
:root {
  --bg:     #080c14;
  --panel:  #0d1420;
  --panel2: #111a2b;
  --line:   #1e2d45;
  --tx:     #c8d8f0;
  --mut:    #546a8a;
  --acc:    #3d8ef0;
  --ok:     #27c97a;
  --warn:   #e8a020;
  --err:    #e04040;
  --purple: #9060e0;
  --teal:   #20b8a0;

  --ok-dim:   rgba(39,201,122,.12);
  --warn-dim: rgba(232,160,32,.12);
  --err-dim:  rgba(224,64,64,.12);
  --acc-dim:  rgba(61,142,240,.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font: 12px/1.5 'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, monospace;
  background: var(--bg);
  color: var(--tx);
  display: flex;
  flex-direction: column;
}

/* ── header ── */
#hdr {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
#hdr .logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--tx);
}
#hdr .logo span { color: var(--acc); }
#hdr .sep { width: 1px; height: 16px; background: var(--line); }
.pill {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  font-weight: 600;
  letter-spacing: .04em;
}
.pill.ok   { background: var(--ok-dim);   color: var(--ok);   }
.pill.warn { background: var(--warn-dim); color: var(--warn); }
.pill.err  { background: var(--err-dim);  color: var(--err);  }
.pill.idle { background: rgba(255,255,255,.06); color: var(--mut); }
.pill.acc  { background: var(--acc-dim);  color: var(--acc);  }
#hdr .hstats { display: flex; gap: 10px; margin-left: auto; align-items: center; }
#hdr .hstats .hs {
  font-size: 10px; color: var(--mut);
  display: flex; align-items: center; gap: 4px;
}
#hdr .hstats .hs b { font-size: 12px; color: var(--tx); }
.hbtn {
  font: inherit; font-size: 11px;
  padding: 4px 10px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--panel2);
  color: var(--tx);
  cursor: pointer;
}
.hbtn:hover { border-color: var(--acc); color: var(--acc); }
.hbtn.p { background: var(--acc); color: #020e22; border-color: var(--acc); font-weight: 700; }
.hbtn.p:hover { opacity: .85; }

/* ── main layout ── */
#main {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

/* ── canvas area ── */
#canvasWrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#scape {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
}

/* ── right sidebar ── */
#sidebar {
  width: 260px;
  flex-shrink: 0;
  border-left: 1px solid var(--line);
  background: var(--panel);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sb-section {
  border-bottom: 1px solid var(--line);
  padding: 10px 12px;
}
.sb-section:last-child { border-bottom: none; flex: 1; overflow: hidden; }
.sb-title {
  font-size: 10px;
  color: var(--mut);
  letter-spacing: .06em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sb-title .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--mut);
  flex-shrink: 0;
}
.sb-title .dot.ok   { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.sb-title .dot.warn { background: var(--warn); }
.sb-title .dot.err  { background: var(--err);  box-shadow: 0 0 6px var(--err); }

/* monitor bar */
.mbar-wrap { height: 5px; background: rgba(255,255,255,.07); border-radius: 3px; overflow: hidden; margin: 5px 0 8px; }
.mbar      { height: 100%; border-radius: 3px; transition: width .6s, background .4s; }
.mon-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.mon-stat  { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
             padding: 5px 8px; text-align: center; }
.mon-stat .val { font-size: 16px; font-weight: 700; line-height: 1; }
.mon-stat .lbl { font-size: 9px; color: var(--mut); margin-top: 2px; }

/* vector list */
#vectorList { flex: 1; overflow-y: auto; }
.vrow {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
  cursor: pointer;
}
.vrow:hover { background: rgba(255,255,255,.03); }
.vrow:last-child { border-bottom: none; }
.vcircle {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid transparent;
}
.vcircle.implicated { border-color: var(--err); animation: pulse-err 1s infinite; }
@keyframes pulse-err { 0%,100%{opacity:1} 50%{opacity:.4} }
.vname { flex: 1; font-size: 10px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcount { font-size: 10px; color: var(--mut); }
.vscore { font-size: 10px; font-weight: 700; min-width: 36px; text-align: right; }
.vscore.hot  { color: var(--ok); }
.vscore.cold { color: var(--err); }
.vscore.mid  { color: var(--warn); }

/* tooltip */
#tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 11px;
  max-width: 220px;
  z-index: 100;
  display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
#tooltip .tt-name { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
#tooltip .tt-row  { display: flex; justify-content: space-between; gap: 8px; color: var(--mut); }
#tooltip .tt-row b { color: var(--tx); }
#tooltip .tt-vec  { font-size: 10px; color: var(--mut); margin-top: 4px; padding-top: 4px;
                    border-top: 1px solid var(--line); word-break: break-all; }

/* detail panel (bottom of canvas) */
#detail {
  position: absolute;
  bottom: 12px; left: 12px;
  background: rgba(13,20,32,.92);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 14px;
  font-size: 11px;
  max-width: 380px;
  display: none;
  backdrop-filter: blur(4px);
  z-index: 10;
}
#detail .dt-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
#detail .dt-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
#detail .dt-k { color: var(--mut); }
#detail .dt-v { color: var(--tx); }
#detail .dt-opts {
  margin-top: 8px;
  padding: 6px 8px;
  background: #020509;
  border-radius: 6px;
  font-size: 10px;
  color: var(--teal);
  word-break: break-all;
  max-height: 80px;
  overflow-y: auto;
}
#detail .dt-close {
  position: absolute; top: 8px; right: 10px;
  background: none; border: none; color: var(--mut); cursor: pointer; font-size: 14px;
}
#detail .dt-close:hover { color: var(--err); }

/* legend */
#legend {
  position: absolute;
  top: 10px; right: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 10px;
  color: var(--mut);
  pointer-events: none;
}
.leg-row { display: flex; align-items: center; gap: 6px; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.leg-line { width: 22px; height: 2px; border-radius: 1px; flex-shrink: 0; }

/* log section */
#logBox {
  flex: 1;
  overflow-y: auto;
  font-size: 10px;
  line-height: 1.6;
  padding: 6px 0;
}
.le { display: flex; gap: 6px; padding: 2px 12px; }
.le .ts  { color: var(--mut); flex-shrink: 0; }
.le.ok   .msg { color: var(--ok); }
.le.warn .msg { color: var(--warn); }
.le.error .msg { color: var(--err); }
.le.info  .msg { color: var(--tx); }

/* scrub controls */
#controls {
  position: absolute;
  top: 10px; left: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 10;
}
.ctrl-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--mut);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ctrl-btn:hover { border-color: var(--acc); color: var(--acc); }
</style>
</head>
<body>

<!-- ── header ── -->
<div id="hdr">
  <div class="logo">zapret2 · <span>evasion landscape</span></div>
  <div class="sep"></div>
  <span class="pill idle" id="poolPill">pool idle</span>
  <span class="pill idle" id="monPill">monitor —</span>
  <span class="pill idle" id="vecPill">0 vectors</span>
  <div class="hstats">
    <div class="hs">стратегий <b id="hStrat">—</b></div>
    <div class="hs">срезов <b id="hCuts" style="color:var(--err)">0</b></div>
    <div class="hs">здоровых <b id="hHealth" style="color:var(--ok)">—</b></div>
    <div class="hs">YT-соед. <b id="hConns">—</b></div>
  </div>
  <div class="sep"></div>
  <button class="hbtn" onclick="togglePool()">вкл/выкл пул</button>
  <button class="hbtn" onclick="forceCheck()">↻ проверить</button>
  <button class="hbtn p" onclick="addSlot()">+ слот</button>
</div>

<!-- ── main ── -->
<div id="main">

  <!-- canvas -->
  <div id="canvasWrap">
    <canvas id="scape"></canvas>

    <!-- zoom controls -->
    <div id="controls">
      <button class="ctrl-btn" title="приблизить" onclick="zoom(1.2)">+</button>
      <button class="ctrl-btn" title="отдалить"   onclick="zoom(0.8)">−</button>
      <button class="ctrl-btn" title="сброс вида" onclick="resetView()" style="font-size:11px">⌂</button>
    </div>

    <!-- legend -->
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:var(--ok)"></div>активная стратегия</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--warn)"></div>деградирует</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--err)"></div>сожжена ТСПУ</div>
      <div class="leg-row"><div class="leg-dot" style="background:var(--mut);opacity:.5"></div>в резерве</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--ok);opacity:.7"></div>поток трафика</div>
      <div class="leg-row"><div class="leg-line" style="background:var(--err);opacity:.7;height:1px;border-top:1px dashed var(--err)"></div>срез ТСПУ</div>
    </div>

    <!-- node detail popup -->
    <div id="detail">
      <button class="dt-close" onclick="closeDetail()">×</button>
      <div class="dt-name" id="dtName"></div>
      <div class="dt-grid" id="dtGrid"></div>
      <div class="dt-opts" id="dtOpts"></div>
    </div>
  </div>

  <!-- right sidebar -->
  <div id="sidebar">

    <!-- TSPU monitor -->
    <div class="sb-section">
      <div class="sb-title"><div class="dot" id="monDot"></div>детектор ТСПУ</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
        <span style="color:var(--mut);font-size:10px">reset ratio</span>
        <span id="monRatio" style="font-size:14px;font-weight:700">—</span>
      </div>
      <div class="mbar-wrap"><div class="mbar" id="monBar" style="width:0%;background:var(--ok)"></div></div>
      <div class="mon-stats">
        <div class="mon-stat"><div class="val" id="monResets" style="color:var(--err)">—</div><div class="lbl">resets</div></div>
        <div class="mon-stat"><div class="val" id="monCloses" style="color:var(--ok)">—</div><div class="lbl">closes</div></div>
        <div class="mon-stat"><div class="val" id="monWindow">—</div><div class="lbl">окно</div></div>
      </div>
    </div>

    <!-- vector list -->
    <div class="sb-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">
      <div class="sb-title"><div class="dot"></div>векторы уязвимости</div>
      <div id="vectorList"></div>
    </div>

    <!-- event log -->
    <div class="sb-section" style="flex:0 0 180px;display:flex;flex-direction:column;overflow:hidden">
      <div class="sb-title" style="margin-bottom:4px">
        <div class="dot"></div>лог событий
        <button class="hbtn" style="margin-left:auto;padding:1px 6px;font-size:9px" onclick="clearLog()">очист.</button>
      </div>
      <div id="logBox"></div>
    </div>

  </div>
</div>

<!-- tooltip -->
<div id="tooltip">
  <div class="tt-name" id="ttName"></div>
  <div id="ttRows"></div>
  <div class="tt-vec" id="ttVec"></div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════
// API helpers
// ═══════════════════════════════════════════════════════════════════════
async function api(path){ try{ return await (await fetch(path)).json(); }catch{ return {}; } }
function post(path,d){ return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}); }

// ═══════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════
let _strategies  = [];   // [{name, nfqws_opt, description}, ...]
let _slots       = [];   // current pool slots
let _scores      = {};   // name → score
let _vectorData  = [];   // [{vector, strategies[], score, hazard, implicated}]
let _traffic     = {};   // qnum → {kbps, pkts_delta, ...}
let _cuts        = 0;
let _logEntries  = [];
let _logLen      = 0;

// canvas scene graph
let _nodes       = [];   // enriched strategy nodes for canvas
let _edges       = [];   // traffic beam segments [{from, to, strength, live}]
let _cutFlashes  = [];   // [{x,y,t}] — burn animations at TSPU-cut coordinates
let _beamPhase   = 0;    // animated offset for flowing beam dashes

// camera
let _cam = { x: 0, y: 0, scale: 1 };
let _drag = null;

// selected node
let _selected = null;

// vector colour table (built on first /api/pool/vectors fetch)
const _vecColors = {};
const _PALETTE = [
  '#3d8ef0','#27c97a','#e8a020','#9060e0','#20b8a0',
  '#e04898','#60a0e0','#80d040','#e06030','#8080ff',
];
let _palIdx = 0;

function vecColor(v){ if(!_vecColors[v]){ _vecColors[v] = _PALETTE[_palIdx++ % _PALETTE.length]; } return _vecColors[v]; }

// ═══════════════════════════════════════════════════════════════════════
// Canvas setup
// ═══════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('scape');
const ctx    = canvas.getContext('2d');

function resize(){
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  layoutNodes();
}
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════════════════
// Layout: place nodes deterministically, group by vector
// ═══════════════════════════════════════════════════════════════════════
function layoutNodes(){
  const W = canvas.width, H = canvas.height;
  if(!W || !H || !_nodes.length) return;

  // group by vector
  const groups = {};
  for(const n of _nodes){ (groups[n.vector] = groups[n.vector]||[]).push(n); }
  const vecs = Object.keys(groups);
  const nv   = vecs.length;

  vecs.forEach((v, vi) => {
    const members = groups[v];
    // vector cluster centre — arranged in a circle of clusters
    const angle   = (vi / nv) * Math.PI * 2 - Math.PI / 2;
    const radius  = Math.min(W, H) * 0.30;
    const cx      = W/2 + radius * Math.cos(angle);
    const cy      = H/2 + radius * Math.sin(angle);

    // within cluster: small sunflower layout
    members.forEach((n, i) => {
      if(n.pinned && n.x !== undefined) return;   // keep user-dragged nodes
      const golden = 2.399963;
      const r  = i === 0 ? 0 : (i < members.length ? 22 * Math.sqrt(i) : 0);
      const a  = i * golden;
      n.x  = cx + r * Math.cos(a);
      n.y  = cy + r * Math.sin(a);
      n.tx = n.x; n.ty = n.y;
    });
  });
}

// ═══════════════════════════════════════════════════════════════════════
// Build traffic beam edges
// ═══════════════════════════════════════════════════════════════════════
function buildEdges(){
  _edges = [];
  // Each active slot is a "source" pulling traffic through its strategy node
  // If two slots share the same vector, we draw a "chain" through them
  // ordered by qnum, showing traffic passing sequentially.
  const activeSlots = _slots.filter(s => s.strategy);

  // group active slots by vector
  const byVec = {};
  for(const sl of activeSlots){
    const n = _nodes.find(n => n.name === sl.strategy);
    if(!n) continue;
    const v = n.vector;
    (byVec[v] = byVec[v]||[]).push({slot: sl, node: n});
  }
  for(const [v, members] of Object.entries(byVec)){
    if(members.length < 2) continue;
    // sort by qnum for chain ordering
    members.sort((a,b) => a.slot.qnum - b.slot.qnum);
    for(let i = 0; i < members.length-1; i++){
      const a = members[i], b = members[i+1];
      const traf_a = _traffic[a.slot.qnum] || {};
      const traf_b = _traffic[b.slot.qnum] || {};
      const strength = Math.max(traf_a.kbps||0, traf_b.kbps||0);
      _edges.push({ from: a.node, to: b.node, vector: v, strength,
                    live: strength > 0.1 });
    }
  }
}

// ═══════════════════════════════════════════════════════════════════════
// Draw
// ═══════════════════════════════════════════════════════════════════════
function wtx(x){ return x * _cam.scale + _cam.x; }
function wty(y){ return y * _cam.scale + _cam.y; }

function drawFrame(ts){
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  // faint grid
  ctx.save();
  ctx.strokeStyle = 'rgba(30,45,69,.4)';
  ctx.lineWidth = 1;
  const gs = 80 * _cam.scale;
  const ox = _cam.x % gs, oy = _cam.y % gs;
  for(let x = ox; x < W; x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y = oy; y < H; y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();

  _beamPhase = (ts / 18) % 20;

  // ── vector cluster halos ──
  const groups = {};
  for(const n of _nodes){ (groups[n.vector]=groups[n.vector]||[]).push(n); }
  for(const [v, members] of Object.entries(groups)){
    if(members.length < 2) continue;
    const cx = members.reduce((s,n)=>s+wtx(n.x),0)/members.length;
    const cy = members.reduce((s,n)=>s+wty(n.y),0)/members.length;
    let maxR  = 0;
    for(const m of members) maxR = Math.max(maxR, Math.hypot(wtx(m.x)-cx, wty(m.y)-cy));
    const r   = Math.max(maxR + 28, 36);
    const col = vecColor(v);
    const vd  = _vectorData.find(x=>x.vector===v);
    const imp = vd && vd.implicated;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    const baseAlpha = imp ? .10 : .04;
    grd.addColorStop(0, col + '28');
    grd.addColorStop(1, col + '00');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();
    if(imp){
      ctx.strokeStyle = 'rgba(224,64,64,.25)';
      ctx.lineWidth   = 1.5;
      ctx.setLineDash([4,4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // vector label
    ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillStyle = col + '99';
    ctx.textAlign = 'center';
    ctx.fillText(v, cx, cy - r - 4);
    ctx.textAlign = 'left';
  }

  // ── traffic beam edges ──
  for(const e of _edges){
    const x1 = wtx(e.from.x), y1 = wty(e.from.y);
    const x2 = wtx(e.to.x),   y2 = wty(e.to.y);
    const col = vecColor(e.vector);
    ctx.save();
    ctx.lineWidth = e.live ? Math.min(3, 1 + e.strength/50) : 1;
    if(e.live){
      ctx.strokeStyle = col;
      ctx.globalAlpha = .55;
      ctx.setLineDash([8, 5]);
      ctx.lineDashOffset = -_beamPhase;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      // arrow head
      const ang = Math.atan2(y2-y1, x2-x1);
      const al  = 10 * _cam.scale;
      ctx.setLineDash([]);
      ctx.globalAlpha = .8;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - al*Math.cos(ang-.4), y2 - al*Math.sin(ang-.4));
      ctx.lineTo(x2 - al*Math.cos(ang+.4), y2 - al*Math.sin(ang+.4));
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
    } else {
      ctx.strokeStyle = col + '44';
      ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    ctx.restore();
  }

  // ── TSPU cut flashes ──
  _cutFlashes = _cutFlashes.filter(f => ts - f.t < 1400);
  for(const f of _cutFlashes){
    const age   = (ts - f.t) / 1400;
    const alpha = Math.max(0, 1 - age);
    const r     = 18 + age * 60;
    ctx.save();
    ctx.globalAlpha = alpha * .7;
    ctx.strokeStyle = 'var(--err)';
    ctx.lineWidth   = 2;
    ctx.beginPath(); ctx.arc(wtx(f.x), wty(f.y), r * _cam.scale, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // ── nodes ──
  for(const n of _nodes){
    const nx = wtx(n.x), ny = wty(n.y);
    const r  = (n.slot ? 11 : 7) * _cam.scale;

    let fillColor, strokeColor, glowColor;
    if(n.burned){
      fillColor   = '#30101a';
      strokeColor = 'var(--err)';
      glowColor   = 'rgba(224,64,64,.6)';
    } else if(n.slot){
      const sl = n.slot;
      if(sl.healthy === true){
        fillColor   = '#0d2a1a';
        strokeColor = 'var(--ok)';
        glowColor   = 'rgba(39,201,122,.5)';
      } else if(sl.healthy === false){
        fillColor   = '#2a1a0a';
        strokeColor = 'var(--warn)';
        glowColor   = 'rgba(232,160,32,.4)';
      } else {
        fillColor   = 'var(--panel2)';
        strokeColor = 'var(--mut)';
        glowColor   = null;
      }
    } else {
      fillColor   = 'var(--panel2)';
      strokeColor = vecColor(n.vector) + '88';
      glowColor   = null;
    }

    // glow
    if(glowColor){
      const gr = ctx.createRadialGradient(nx, ny, 0, nx, ny, r * 2.4);
      gr.addColorStop(0, glowColor);
      gr.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(nx, ny, r * 2.4, 0, Math.PI*2);
      ctx.fillStyle = gr; ctx.fill();
    }

    // circle
    ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI*2);
    ctx.fillStyle   = fillColor;
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth   = n === _selected ? 2.5 : 1.5;
    ctx.fill(); ctx.stroke();

    // traffic dot (inner live indicator)
    const traf = n.slot ? (_traffic[n.slot.qnum] || {}) : {};
    if(traf.pkts_delta > 0){
      const pulse = .5 + .5 * Math.sin(ts / 220);
      ctx.beginPath(); ctx.arc(nx, ny, 3 * _cam.scale, 0, Math.PI*2);
      ctx.fillStyle = `rgba(39,201,122,${.5 + .5*pulse})`;
      ctx.fill();
    }

    // label
    if(_cam.scale > 0.5){
      const fs = Math.max(8, 10 * _cam.scale);
      ctx.font = `${fs}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillStyle = n.slot ? 'var(--tx)' : 'var(--mut)';
      ctx.textAlign = 'center';
      ctx.fillText(n.shortName, nx, ny + r + fs + 1);
      ctx.textAlign = 'left';
    }

    // slot badge
    if(n.slot && _cam.scale > 0.65){
      const badge = 'С' + n.slot.index;
      const bfs   = Math.max(7, 8 * _cam.scale);
      ctx.font      = `bold ${bfs}px monospace`;
      ctx.fillStyle = strokeColor;
      ctx.textAlign = 'center';
      ctx.fillText(badge, nx, ny + 4 * _cam.scale);
      ctx.textAlign = 'left';
    }
  }

  requestAnimationFrame(drawFrame);
}

// ═══════════════════════════════════════════════════════════════════════
// Camera / interaction
// ═══════════════════════════════════════════════════════════════════════
function toWorld(cx, cy){ return { x: (cx - _cam.x) / _cam.scale, y: (cy - _cam.y) / _cam.scale }; }

canvas.addEventListener('mousedown', e => {
  const w = toWorld(e.offsetX, e.offsetY);
  const hit = hitTest(w.x, w.y);
  if(hit){
    _drag = { node: hit, sx: e.offsetX, sy: e.offsetY, ox: hit.x, oy: hit.y };
  } else {
    _drag = { cam: true, sx: e.offsetX, sy: e.offsetY, ox: _cam.x, oy: _cam.y };
  }
});
canvas.addEventListener('mousemove', e => {
  if(_drag){
    const dx = e.offsetX - _drag.sx, dy = e.offsetY - _drag.sy;
    if(_drag.node){
      _drag.node.x = _drag.ox + dx / _cam.scale;
      _drag.node.y = _drag.oy + dy / _cam.scale;
      _drag.node.pinned = true;
    } else {
      _cam.x = _drag.ox + dx;
      _cam.y = _drag.oy + dy;
    }
    return;
  }
  // tooltip
  const w = toWorld(e.offsetX, e.offsetY);
  const hit = hitTest(w.x, w.y);
  if(hit) showTooltip(e.clientX, e.clientY, hit);
  else    hideTooltip();
});
canvas.addEventListener('mouseup', e => {
  if(_drag && !_drag.cam){
    const dx = Math.abs(e.offsetX - _drag.sx), dy = Math.abs(e.offsetY - _drag.sy);
    if(dx < 4 && dy < 4) openDetail(_drag.node);   // click, not drag
  }
  _drag = null;
});
canvas.addEventListener('mouseleave', () => { _drag = null; hideTooltip(); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 0.89;
  const cx = e.offsetX, cy = e.offsetY;
  _cam.x = cx + (_cam.x - cx) * f;
  _cam.y = cy + (_cam.y - cy) * f;
  _cam.scale *= f;
}, { passive: false });

function hitTest(wx, wy){
  const hitR = 14 / _cam.scale;
  for(const n of _nodes)
    if(Math.hypot(n.x - wx, n.y - wy) < hitR) return n;
  return null;
}

function zoom(f){
  const cx = canvas.width/2, cy = canvas.height/2;
  _cam.x = cx + (_cam.x - cx) * f;
  _cam.y = cy + (_cam.y - cy) * f;
  _cam.scale *= f;
}

function resetView(){
  _cam = { x: 0, y: 0, scale: 1 };
  layoutNodes();
}

// ═══════════════════════════════════════════════════════════════════════
// Tooltip / detail
// ═══════════════════════════════════════════════════════════════════════
const ttEl   = document.getElementById('tooltip');
const ttName = document.getElementById('ttName');
const ttRows = document.getElementById('ttRows');
const ttVec  = document.getElementById('ttVec');

function showTooltip(cx, cy, n){
  ttName.textContent = n.name;
  const sl    = n.slot;
  const score = (_scores[n.name] || 0).toFixed(1);
  const traf  = sl ? (_traffic[sl.qnum] || {}) : {};
  let rows = '';
  rows += row('вектор', n.vector);
  rows += row('скор',   (score > 0 ? '+' : '') + score);
  if(sl){
    rows += row('слот',     'С' + sl.index + ' qnum=' + sl.qnum);
    rows += row('статус',   sl.healthy === true ? '✓ работает' : sl.healthy === false ? '✗ сбой' : '⟳');
    rows += row('трафик',   (traf.kbps||0).toFixed(1) + ' kbps');
  }
  if(n.burned) rows += `<div style="color:var(--err);margin-top:4px">⚡ сожжена ТСПУ</div>`;
  ttRows.innerHTML = rows;
  ttVec.textContent = n.vector;
  ttEl.style.display = 'block';
  ttEl.style.left = (cx + 14) + 'px';
  ttEl.style.top  = (cy -  8) + 'px';
}
function hideTooltip(){ ttEl.style.display = 'none'; }
function row(k,v){ return `<div class="tt-row"><span>${k}</span><b>${v}</b></div>`; }

function openDetail(n){
  _selected = n;
  const sl  = n.slot;
  const traf = sl ? (_traffic[sl.qnum]||{}) : {};
  document.getElementById('dtName').textContent = n.name;
  let g = '';
  g += drow('вектор',     n.vector);
  g += drow('скор',       ((_scores[n.name]||0)>0?'+':'') + (_scores[n.name]||0).toFixed(1));
  g += drow('состояние',  n.burned ? '⚡ сожжена' : sl ? (sl.healthy===true?'✓ работает':sl.healthy===false?'✗ деградация':'⟳ ожидание') : '— резерв');
  if(sl){
    g += drow('слот',     'С' + sl.index + '  qnum=' + sl.qnum);
    g += drow('трафик',   (traf.kbps||0).toFixed(1) + ' kbps · ' + (traf.pps||0).toFixed(1) + ' pps');
  }
  document.getElementById('dtGrid').innerHTML  = g;
  document.getElementById('dtOpts').textContent = n.nfqws_opt || '(нет NFQWS2_OPT)';
  document.getElementById('detail').style.display = 'block';
}
function drow(k,v){ return `<span class="dt-k">${k}</span><span class="dt-v">${v}</span>`; }
function closeDetail(){ document.getElementById('detail').style.display='none'; _selected=null; }

// ═══════════════════════════════════════════════════════════════════════
// Data refresh
// ═══════════════════════════════════════════════════════════════════════
async function refreshAll(){
  await Promise.all([refreshStrategies(), refreshPool(), refreshVectors(), refreshMonitor(), refreshLog(), refreshTraffic()]);
}

async function refreshStrategies(){
  const d = await api('/api/strategies');
  _strategies = d.strategies || [];
  document.getElementById('hStrat').textContent = _strategies.length;
  rebuildNodes();
}

async function refreshPool(){
  const s = await api('/api/pool/status');
  _slots  = s.slots || [];
  _cuts   = s.total_cuts || 0;
  document.getElementById('hCuts').textContent   = _cuts;
  document.getElementById('hConns').textContent  = s.active_conns !== undefined ? s.active_conns : '—';
  document.getElementById('hHealth').textContent = s.healthy_count !== undefined
    ? s.healthy_count + '/' + _slots.length : '—';

  const st = s.state || 'idle';
  const labels = {idle:'pool idle', ok:'pool ✓', degraded:'деградация', checking:'проверка…', replacing:'замена…'};
  const pp = document.getElementById('poolPill');
  pp.textContent = labels[st] || st;
  pp.className   = 'pill ' + ({ok:'ok',degraded:'warn',replacing:'warn',checking:'acc',idle:'idle'}[st]||'idle');

  _poolEnabled = !!s.enabled;
  _scores = s.strategy_scores || {};

  // update node state from slots
  const slotByStrat = {};
  for(const sl of _slots) if(sl.strategy) slotByStrat[sl.strategy] = sl;
  for(const n of _nodes){
    n.slot = slotByStrat[n.name] || null;
  }

  buildEdges();
}

async function refreshVectors(){
  const d = await api('/api/pool/vectors');
  _vectorData = (d.vectors || []);

  // implication: trigger cut flash on burned nodes
  const imp = _vectorData.filter(v=>v.implicated).map(v=>v.vector);
  for(const n of _nodes){
    const wasImp = n.implicated;
    n.implicated = imp.includes(n.vector);
    n.burned     = n.hazard >= 0.7;
    if(n.implicated && !wasImp){
      _cutFlashes.push({ x: n.x, y: n.y, t: performance.now() });
    }
  }

  // update hazard on nodes from vector data
  const hazByVec = {};
  for(const v of _vectorData) hazByVec[v.vector] = v.hazard;
  for(const n of _nodes){
    const vd = _vectorData.find(v=>v.vector===n.vector);
    n.hazard = vd ? vd.hazard : 0;
    n.burned = n.hazard >= 0.7 && n.implicated;
  }

  const vp = document.getElementById('vecPill');
  vp.textContent = _vectorData.length + ' векторов';
  const anyImp = _vectorData.some(v=>v.implicated);
  vp.className  = 'pill ' + (anyImp ? 'err' : 'idle');

  renderVectorList();
}

async function refreshMonitor(){
  const s = await api('/api/monitor/status');
  if(!s || s.error) return;
  const pct   = Math.min(100, s.ratio * 100);
  const color = s.degraded ? 'var(--err)' : (pct > 25 ? 'var(--warn)' : 'var(--ok)');
  document.getElementById('monRatio').textContent    = (s.ratio*100).toFixed(1) + '%';
  document.getElementById('monRatio').style.color    = color;
  document.getElementById('monBar').style.width      = pct.toFixed(1) + '%';
  document.getElementById('monBar').style.background = color;
  document.getElementById('monResets').textContent   = s.resets_window;
  document.getElementById('monCloses').textContent   = s.closes_window;
  document.getElementById('monWindow').textContent   = s.window_sec + 's';
  const dot = document.getElementById('monDot');
  dot.className = 'dot ' + (s.degraded ? 'err' : 'ok');
  const mp  = document.getElementById('monPill');
  mp.textContent = s.degraded ? '⚠ деградация' : 'monitor ✓';
  mp.className   = 'pill ' + (s.degraded ? 'err' : 'ok');
}

async function refreshTraffic(){
  const d = await api('/api/pool/traffic');
  if(!d || d.error) return;
  _traffic = d;
}

// ── curl ──────────────────────────────────────────────────────────────────
function updateCurlCmd(){
  const url  = document.getElementById('curlUrl').value.trim() || 'https://google.com';
  const port = document.getElementById('curlPort').value || '1080';
  document.getElementById('curlCmd').textContent = 'curl -x socks5h://127.0.0.1:' + port + ' ' + url + ' -I';
}
async function runCurl(){
  const url  = document.getElementById('curlUrl').value.trim() || 'https://google.com';
  const port = parseInt(document.getElementById('curlPort').value) || 1080;
  updateCurlCmd(); showLog('curlLog','⏳ …','n');
  const r = await post('/api/test-curl',{url, socks_port:port});
  showLog('curlLog',(r.ok?'✅ OK':'❌ FAIL')+' (rc='+r.rc+')\n\n'+(r.output||''),r.ok?'ok':'err');
}

// ── import ────────────────────────────────────────────────────────────────
async function importJson(){
  const raw = document.getElementById('jsonInput').value.trim();
  if(!raw){alert('Вставьте JSON');return;}
  let parsed; try{parsed=JSON.parse(raw);}catch(e){alert('Невалидный JSON: '+e);return;}
  const prefix = document.getElementById('jsonPrefix').value.trim();
  if(prefix) parsed.name_prefix = prefix;
  showLog('importLog','⏳ …','n');
  const r = await post('/api/import-json', parsed);
  let txt = r.message||'';
  if(r.saved?.length)  txt += '\n✅ ' + r.saved.join(', ');
  if(r.errors?.length) txt += '\n❌ ' + r.errors.join('\n');
  showLog('importLog', txt.trim(), r.ok?'ok':'err');
  if(r.ok) loadStrategies();
}


async function refreshLog(){
  const d = await api('/api/pool/log');
  const log = d.log || [];
  if(log.length === _logLen) return;
  _logLen = log.length;
  _logEntries = log;
  renderLog();
}

function renderLog(){
  const box = document.getElementById('logBox');
  if(!_logEntries.length){ box.innerHTML = '<div style="color:var(--mut);padding:0 12px">—</div>'; return; }
  box.innerHTML = [..._logEntries].reverse().slice(0,60).map(e=>
    `<div class="le ${e.level}"><span class="ts">${e.ts}</span><span class="msg">${e.msg}</span></div>`
  ).join('');
}

function clearLog(){ _logLen = 0; _logEntries = []; renderLog(); }

// ═══════════════════════════════════════════════════════════════════════
// Node management
// ═══════════════════════════════════════════════════════════════════════
function rebuildNodes(){
  const existing = {};
  for(const n of _nodes) existing[n.name] = n;

  const next = [];
  for(const s of _strategies){
    const old = existing[s.name];
    const vd  = _vectorData.find(v => v.strategies && v.strategies.includes(s.name));
    const vec = (vd && vd.vector) || classifyVectorClient(s.nfqws_opt || '');
    const n   = old || { x: canvas.width/2 + (Math.random()-.5)*200,
                         y: canvas.height/2 + (Math.random()-.5)*200, pinned: false };
    n.name      = s.name;
    n.shortName = s.name.length > 14 ? s.name.slice(0,13) + '…' : s.name;
    n.nfqws_opt = s.nfqws_opt || '';
    n.vector    = vec;
    n.slot      = null;   // filled by refreshPool
    n.burned    = false;
    n.hazard    = 0;
    n.implicated= false;
    next.push(n);
  }
  _nodes = next;
  layoutNodes();
}

// lightweight client-side vector classify (mirrors strategy_vectors.py)
function classifyVectorClient(opt){
  if(!opt || !opt.trim()) return 'other';
  const text = opt.split('--new')[0];
  const modeMatch = text.match(/--dpi-desync=(\S+)/);
  let family = 'other';
  if(modeMatch){
    const MODE = {split:'seg',split2:'seg',multisplit:'seg',disorder:'seg',disorder2:'seg',
                  multidisorder:'seg',fake:'fake',fakedsplit:'fake',fakeddisorder:'fake',
                  fakedisorder:'fake',fake_syndata:'fake',ipfrag1:'ipfrag',ipfrag2:'ipfrag',
                  hopbyhop:'ipv6ext',hopbyhop2:'ipv6ext',destopt:'ipv6ext',
                  syndata:'tcpstate',rst:'tcpstate',rstack:'tcpstate'};
    const fams = new Set(modeMatch[1].split(',').map(t=>MODE[t.trim()]).filter(Boolean));
    family = [...fams].sort().join('+') || 'other';
  }
  const fool = (text.match(/--dpi-desync-fooling=(\S+)/)||[])[1];
  const foolPart = fool ? [...new Set(fool.split(',').filter(t=>
    ['md5sig','ts','badsum','badseq','datanoack','hopbyhop','hopbyhop2'].includes(t)))].sort().join(',') : '';
  const ttlPart  = /--dpi-desync-(auto)?ttl/.test(text) ? 'ttl' : '';
  const extra    = [];
  if(/--dpi-desync-fake-tls/.test(text))  extra.push('faketls');
  if(/--dpi-desync-fake-quic/.test(text)) extra.push('fakequic');
  const l7m  = text.match(/--filter-l7=(\S+)/);
  const l7   = l7m ? l7m[1].trim() : 'generic';
  return [family, foolPart, ttlPart, ...extra, l7].filter(Boolean).join('+');
}

// ═══════════════════════════════════════════════════════════════════════
// Vector sidebar list
// ═══════════════════════════════════════════════════════════════════════
function renderVectorList(){
  const box = document.getElementById('vectorList');
  if(!_vectorData.length){ box.innerHTML = '<div style="color:var(--mut);padding:5px 0;font-size:10px">нет данных</div>'; return; }

  const sorted = [..._vectorData].sort((a,b) => {
    if(a.implicated !== b.implicated) return a.implicated ? -1 : 1;
    return (b.hazard||0) - (a.hazard||0);
  });

  box.innerHTML = sorted.map(v => {
    const col   = vecColor(v.vector);
    const sc    = (v.score||0);
    const scCls = sc > 0.5 ? 'hot' : sc < -0.5 ? 'cold' : 'mid';
    const imp   = v.implicated;
    const hz    = ((v.hazard||0)*100).toFixed(0);
    return `<div class="vrow" onclick="focusVector('${CSS.escape(v.vector)}')">
      <div class="vcircle ${imp?'implicated':''}" style="background:${col}${imp?'':'88'}"></div>
      <div class="vname" title="${v.vector}">${v.vector}</div>
      <div class="vcount">${v.strategies.length}σ</div>
      <div class="vcount" style="color:${imp?'var(--err)':hz>50?'var(--warn)':'var(--mut)'}">${hz}%</div>
      <div class="vscore ${scCls}">${sc>0?'+':''}${sc.toFixed(1)}</div>
    </div>`;
  }).join('');
}

function focusVector(v){
  // pan camera to centre of the vector cluster
  const members = _nodes.filter(n => n.vector === v);
  if(!members.length) return;
  const cx = members.reduce((s,n)=>s+n.x,0)/members.length;
  const cy = members.reduce((s,n)=>s+n.y,0)/members.length;
  _cam.x = canvas.width/2  - cx * _cam.scale;
  _cam.y = canvas.height/2 - cy * _cam.scale;
}

// ═══════════════════════════════════════════════════════════════════════
// Pool controls
// ═══════════════════════════════════════════════════════════════════════
let _poolEnabled = false;
async function togglePool(){
  const s = await api('/api/pool/status');
  _poolEnabled = s.enabled;
  await post('/api/pool/enable', {enabled: !_poolEnabled});
  refreshPool();
}
async function forceCheck(){ await post('/api/pool/check', {}); setTimeout(refreshPool, 900); }
async function addSlot(){
  const r = await post('/api/pool/slot/add', {});
  if(r.error) alert(r.error);
  else refreshPool();
}

// Boot
// ═══════════════════════════════════════════════════════════════════════
resize();
requestAnimationFrame(drawFrame);

(async () => {
  await refreshAll();
  setInterval(refreshPool,       3000);
  setInterval(refreshVectors,    4000);
  setInterval(refreshMonitor,    3000);
  setInterval(refreshLog,        4000);
  setInterval(refreshTraffic,    2000);
  setInterval(refreshStrategies, 15000);
})();
