<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zapret2 · панель</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
:root{--bg:#0f1420;--panel:#1a2233;--panel2:#212b40;--line:#2d3a55;
      --tx:#e7ecf5;--mut:#91a3c2;--acc:#4aa3ff;--ok:#35c97f;--warn:#ffb547;--err:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font:14px/1.5 system-ui,Segoe UI,Roboto,Arial;color:var(--tx);background:var(--bg);}
header{padding:13px 20px;display:flex;align-items:center;gap:12px;
       background:var(--panel);border-bottom:1px solid var(--line);}
header h1{font-size:16px;font-weight:700;}
.hp{color:var(--mut);font-size:12px;font-family:monospace;margin-left:auto;}
.wrap{display:grid;grid-template-columns:310px 1fr;gap:14px;padding:14px;}
@media(max-width:860px){.wrap{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;}
.card h2{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-bottom:11px;}
/* strategy list */
.slist{display:flex;flex-direction:column;gap:7px;}
.strat{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
       background:var(--panel2);cursor:pointer;transition:border-color .15s;}
.strat:hover{border-color:var(--acc);}
.strat.active{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok);}
.strat .sname{font-weight:700;font-size:13px;}
.strat .sdesc{color:var(--mut);font-size:11px;margin-top:2px;}
/* right col */
.rcol{display:flex;flex-direction:column;gap:14px;}
/* config box */
#configBox{background:#080d18;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;
  color:#c8d8f0;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:8px;}
/* nfqws editor */
#nfqwsEditor{width:100%;background:#080d18;border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:9px 11px;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;resize:vertical;}
/* import */
#jsonInput{width:100%;background:#080d18;border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:9px 11px;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;resize:vertical;}
/* curl */
.crl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
.inp{background:#080d18;border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:6px 9px;font:inherit;}
/* buttons */
.row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center;}
.btn{font:inherit;padding:7px 13px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);color:var(--tx);cursor:pointer;font-size:13px;}
.btn:hover{border-color:var(--acc);}
.btn.p{background:var(--acc);color:#05111f;font-weight:600;border-color:var(--acc);}
.btn.p:hover{opacity:.88;}
.btn.d{border-color:var(--warn);color:var(--warn);}
.btn.d:hover{background:rgba(255,181,71,.1);}
.btn.sm{padding:4px 9px;font-size:12px;}
/* log */
.log{margin-top:11px;padding:9px 11px;border-radius:8px;background:#080d18;
  border:1px solid var(--line);white-space:pre-wrap;max-height:220px;overflow:auto;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;display:none;}
.log.ok {color:var(--ok); border-color:rgba(53,201,127,.3);}
.log.err{color:var(--err);border-color:rgba(255,107,107,.3);}
.log.n  {color:var(--mut);}
/* connections */
.connbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;}
.cbtitle{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;}
.cbport{color:var(--acc);font-size:10px;font-family:monospace;}
.cbcount{font-size:28px;font-weight:700;margin:4px 0 6px;line-height:1;}
.cbips{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--mut);
  line-height:1.7;max-height:90px;overflow-y:auto;}
.cbips .ip{display:block;}
</style>
</head>
<body>
<header>
  <h1>zapret2 · панель стратегий</h1>
  <span class="hp" id="hpath"></span>
</header>
<div class="wrap">

  <!-- LEFT: список стратегий -->
  <div class="card">
    <h2>Готовые стратегии</h2>
    <div class="slist" id="slist"><div style="color:var(--mut);font-size:13px">Загрузка…</div></div>
  </div>

  <!-- RIGHT -->
  <div class="rcol">

    <!-- подключения -->
    <div class="card">
      <h2>Активные подключения <span id="connTs" style="color:var(--mut);font-weight:400;font-size:11px"></span></h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px">
        <div class="connbox" id="ssBox">
          <div class="cbtitle">Shadowsocks <span id="ssPort" class="cbport"></span></div>
          <div class="cbcount" id="ssCount">—</div>
          <div class="cbips" id="ssIps"></div>
        </div>
        <div class="connbox" id="socksBox">
          <div class="cbtitle">SOCKS5 <span id="socksPortLabel" class="cbport"></span></div>
          <div class="cbcount" id="socksCount">—</div>
          <div class="cbips" id="socksIps"></div>
        </div>
      </div>
    </div>

    <!-- текущий config -->
    <div class="card">
      <h2>Текущий config <span id="cfgPath" style="color:var(--acc);font-weight:400"></span></h2>
      <div class="row" style="margin-top:0">
        <button class="btn sm" id="refreshCfg">↻ Обновить</button>
        <span id="cfgTs" style="font-size:12px;color:var(--mut)"></span>
      </div>
      <div id="configBox">Загрузка…</div>
    </div>

    <!-- редактор NFQWS2_OPT -->
    <div class="card">
      <h2>Редактор NFQWS2_OPT</h2>
      <textarea id="nfqwsEditor" rows="7" placeholder="--filter-tcp=443 --filter-l7=tls ..."></textarea>
      <div class="row">
        <button class="btn p" id="saveNfqws">Сохранить</button>
        <button class="btn" id="saveAndRestart">Сохранить + перезапустить</button>
        <button class="btn d" id="restartOnly">Перезапуск zapret</button>
        <button class="btn sm" id="showBackup">Бэкап</button>
      </div>
      <div class="log n" id="editLog"></div>
    </div>

    <!-- curl тест -->
    <div class="card">
      <h2>Тест подключения</h2>
      <div class="crl">
        <input class="inp" id="curlUrl" style="flex:1;min-width:150px" type="text" value="https://google.com">
        <input class="inp" id="socksPort" type="number" value="1080" style="width:85px" placeholder="SOCKS порт">
        <button class="btn p" id="runCurl">▶ Тест</button>
      </div>
      <div id="curlCmd" style="font-size:11px;color:var(--mut);margin-top:5px;font-family:monospace"></div>
      <div class="log n" id="curlLog"></div>
    </div>

    <!-- импорт JSON -->
    <div class="card">
      <h2>Импорт стратегий из JSON (blockcheckw / авто-тест)</h2>
      <textarea id="jsonInput" rows="5" placeholder='{ "domain": "youtube.com", "strategies": [{"args": "..."}] }'></textarea>
      <div class="row">
        <input class="inp" id="jsonPrefix" type="text" style="width:180px" placeholder="Префикс имён (необяз.)">
        <button class="btn p" id="importBtn">Импортировать</button>
      </div>
      <div class="log n" id="importLog"></div>
    </div>

  </div><!-- /rcol -->
</div>

<script>
// ── helpers ──────────────────────────────────────────────────────────────
async function api(path, opts){ return (await fetch(path, opts)).json(); }
function post(path, data){
  return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
}
function showLog(id, text, cls){
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.className = 'log ' + (cls||'n');
  el.textContent = text;
}

// ── config refresh ────────────────────────────────────────────────────────
async function refreshCfg(){
  document.getElementById('cfgTs').textContent = '…';
  const c = await api('/api/config');
  document.getElementById('hpath').textContent = c.path || '';
  document.getElementById('cfgPath').textContent = c.path || '';
  document.getElementById('configBox').textContent = c.raw || '(пусто)';
  document.getElementById('nfqwsEditor').value = c.nfqws_opt || '';
  document.getElementById('cfgTs').textContent = 'обновлено ' + new Date().toLocaleTimeString();
}
document.getElementById('refreshCfg').onclick = refreshCfg;

// ── strategies ────────────────────────────────────────────────────────────
async function loadStrategies(){
  const data = await api('/api/strategies');
  const box = document.getElementById('slist');
  box.innerHTML = '';
  if(!data.strategies || !data.strategies.length){
    box.innerHTML = '<div style="color:var(--mut);font-size:13px">Нет стратегий в ./strategies/</div>';
    return;
  }
  for(const s of data.strategies){
    const el = document.createElement('div');
    el.className = 'strat'; el.dataset.name = s.name;
    el.innerHTML = '<div class="sname">' + s.name + '</div>' +
                   (s.description ? '<div class="sdesc">' + s.description + '</div>' : '');
    el.onclick = () => applyPreset(s.name);
    box.appendChild(el);
  }
}

function markActive(name){
  document.querySelectorAll('.strat').forEach(el =>
    el.classList.toggle('active', el.dataset.name === name));
}

// ── apply preset ──────────────────────────────────────────────────────────
async function applyPreset(name){
  if(!confirm('Применить «' + name + '» и перезапустить zapret?')) return;
  showLog('editLog', '⏳ Применяем «' + name + '»…', 'n');
  const r = await post('/api/apply', {preset: name});
  if(r.error){ showLog('editLog', '❌ ' + r.error, 'err'); return; }
  let msg = r.message;
  if(r.restart && r.restart.rc !== 0)
    msg += '\nrestart stderr: ' + r.restart.stderr;
  showLog('editLog', msg, r.ok ? 'ok' : 'err');
  if(r.ok){
    document.getElementById('configBox').textContent = r.raw || '';
    document.getElementById('nfqwsEditor').value = r.nfqws_opt || '';
    document.getElementById('cfgTs').textContent = 'обновлено ' + new Date().toLocaleTimeString();
    markActive(name);
  }
}

// ── editor ────────────────────────────────────────────────────────────────
async function saveNfqws(doRestart){
  const value = document.getElementById('nfqwsEditor').value;
  showLog('editLog', '⏳ Сохраняем…', 'n');
  const r = await post('/api/save-nfqws', {value, restart: doRestart});
  let msg = r.ok ? '✅ Сохранено' : '❌ Ошибка';
  if(r.restart) msg += ' | restart rc=' + r.restart.rc + (r.restart.stderr ? '\n' + r.restart.stderr : '');
  showLog('editLog', msg, r.ok ? 'ok' : 'err');
  if(r.ok){
    document.getElementById('configBox').textContent = r.raw || '';
    document.getElementById('cfgTs').textContent = 'обновлено ' + new Date().toLocaleTimeString();
  }
}
document.getElementById('saveNfqws').onclick    = () => saveNfqws(false);
document.getElementById('saveAndRestart').onclick = () => saveNfqws(true);

document.getElementById('restartOnly').onclick = async () => {
  showLog('editLog', '⏳ Перезапуск…', 'n');
  const r = await post('/api/restart', {});
  showLog('editLog', 'rc=' + r.rc + (r.stderr ? '\n' + r.stderr : '') + (r.stdout ? '\n' + r.stdout : ''),
    r.rc === 0 ? 'ok' : 'err');
};

document.getElementById('showBackup').onclick = async () => {
  const b = await post('/api/backup', {});
  showLog('editLog', b.ok ? b.raw : '❌ Бэкап отсутствует', b.ok ? 'n' : 'err');
};

// ── curl test ─────────────────────────────────────────────────────────────
document.getElementById('socksPort').oninput =
document.getElementById('curlUrl').oninput = () => {
  const url  = document.getElementById('curlUrl').value.trim() || 'https://google.com';
  const port = document.getElementById('socksPort').value || '1080';
  document.getElementById('curlCmd').textContent =
    'curl -x socks5h://127.0.0.1:' + port + ' ' + url + ' -I';
};

document.getElementById('runCurl').onclick = async () => {
  const url  = document.getElementById('curlUrl').value.trim() || 'https://google.com';
  const port = parseInt(document.getElementById('socksPort').value) || 1080;
  document.getElementById('curlCmd').textContent =
    'curl -x socks5h://127.0.0.1:' + port + ' ' + url + ' -I';
  showLog('curlLog', '⏳ …', 'n');
  const r = await post('/api/test-curl', {url, socks_port: port});
  showLog('curlLog', (r.ok ? '✅ OK' : '❌ FAIL') + ' (rc=' + r.rc + ')\n\n' + (r.output||''),
    r.ok ? 'ok' : 'err');
};

// ── import json ───────────────────────────────────────────────────────────
document.getElementById('importBtn').onclick = async () => {
  const raw = document.getElementById('jsonInput').value.trim();
  if(!raw){ alert('Вставьте JSON'); return; }
  let parsed;
  try{ parsed = JSON.parse(raw); } catch(e){ alert('Невалидный JSON: ' + e); return; }
  const prefix = document.getElementById('jsonPrefix').value.trim();
  if(prefix) parsed.name_prefix = prefix;
  showLog('importLog', '⏳ …', 'n');
  const r = await post('/api/import-json', parsed);
  let txt = r.message || '';
  if(r.saved?.length)  txt += '\n✅ ' + r.saved.join(', ');
  if(r.errors?.length) txt += '\n❌ ' + r.errors.join('\n');
  showLog('importLog', txt.trim(), r.ok ? 'ok' : 'err');
  if(r.ok) await loadStrategies();
};

// ── connections ───────────────────────────────────────────────────────────
async function refreshConnections(){
  const data = await api('/api/connections');
  if(data.error){ return; }
  document.getElementById('ssPort').textContent        = ':' + data.ss_port;
  document.getElementById('socksPortLabel').textContent = ':' + data.socks_port;
  document.getElementById('ssCount').textContent    = data.ss.length;
  document.getElementById('socksCount').textContent = data.socks.length;

  function renderIps(elId, ips){
    const el = document.getElementById(elId);
    el.innerHTML = ips.length
      ? ips.map(ip => '<span class="ip">' + ip + '</span>').join('')
      : '<span style="color:var(--line)">нет</span>';
  }
  renderIps('ssIps',    data.ss);
  renderIps('socksIps', data.socks);
  document.getElementById('connTs').textContent = new Date().toLocaleTimeString();
}

// ── init ──────────────────────────────────────────────────────────────────
(async ()=>{
  await Promise.all([refreshCfg(), loadStrategies(), refreshConnections()]);
  document.getElementById('curlUrl').dispatchEvent(new Event('input'));
  setInterval(refreshConnections, 5000);
})();
</script>
</body>
</html>
