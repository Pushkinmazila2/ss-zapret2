services:
  ss-zapret2:
    build: .
    # image: vernette/ss-zapret2:v1.0.2  # закомментировано: используем build
    container_name: zapret2-proxy
    restart: unless-stopped
    environment:
      - SS_PORT=${SS_PORT}
      - SS_PASSWORD=${SS_PASSWORD}
      - SS_ENCRYPT_METHOD=${SS_ENCRYPT_METHOD}
      - SS_TIMEOUT=${SS_TIMEOUT}
      - SOCKS_PORT=${SOCKS_PORT}
      - SS_VERBOSE=${SS_VERBOSE:-0}
      - PANEL_PORT=${PANEL_PORT:-1180}
    ports:
      # Shadowsocks-сервер
      - "${SS_PORT:-8388}:8388/tcp"
      - "${SS_PORT:-8388}:8388/udp"
      
      # SOCKS5-прокси
      - "${SOCKS_PORT:-1181}:1181/tcp"
      - "${SOCKS_PORT:-1181}:1181/udp"
      
      # Веб-панель
      - "${PANEL_PORT:-1180}:1180/tcp"
    volumes:
      - ./config:/opt/zapret2/config
      - ./lua:/opt/zapret2/lua
      - ./fakes:/opt/zapret2/files/fake
      - ./strategies:/opt/zapret2/strategies
      - ./scripts/examples:/opt/zapret2/init.d/custom.d.examples.linux
      - ./scripts/custom.d:/opt/zapret2/init.d/sysv/custom.d
    networks:
      - default
      - s-ui_network
    healthcheck:
      test: [
        "CMD-SHELL",
        "nc -z localhost ${SS_PORT} && nc -z localhost ${SOCKS_PORT} || exit 1"
      ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3s
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  s-ui_network:
    name: s-ui_s-ui
    external: true
